global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Microsserviços Spring Boot (Actuator + Micrometer) rodando no host
  - job_name: spring-microservicos
    metrics_path: /actuator/prometheus
    # As métricas já trazem a tag "application" (Micrometer); honor_labels evita a duplicação
    # como "exported_application". O label estático abaixo garante "application" na série "up".
    honor_labels: true
    static_configs:
      - targets: ["host.docker.internal:8888"]
        labels: { application: config-server }
      - targets: ["host.docker.internal:8761"]
        labels: { application: discovery-server }
      - targets: ["host.docker.internal:8080"]
        labels: { application: gateway-service }
      - targets: ["host.docker.internal:8081"]
        labels: { application: pecas-service }
      - targets: ["host.docker.internal:8082"]
        labels: { application: clientes-service }
      - targets: ["host.docker.internal:8083"]
        labels: { application: representantes-service }
