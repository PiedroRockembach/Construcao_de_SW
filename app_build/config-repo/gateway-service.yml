server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: pecas-route
          uri: lb://pecas-service
          predicates:
            - Path=/api/pecas/**
          filters:
            - StripPrefix=1
        - id: clientes-route
          uri: lb://clientes-service
          predicates:
            - Path=/api/clientes/**
          filters:
            - StripPrefix=1
        - id: representantes-route
          uri: lb://representantes-service
          predicates:
            - Path=/api/representantes/**
          filters:
            - StripPrefix=1
